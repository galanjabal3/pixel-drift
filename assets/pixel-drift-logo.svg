<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0c1e"/>
      <stop offset="60%" stop-color="#0d1024"/>
      <stop offset="100%" stop-color="#101430"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="120" height="80" rx="8" fill="url(#sky)"/>

  <!-- Stars (pixel style) -->
  <rect x="12" y="10" width="2" height="2" fill="#fff" opacity="0.3"/>
  <rect x="38" y="6" width="2" height="2" fill="#fff" opacity="0.2"/>
  <rect x="67" y="14" width="3" height="3" fill="#fff" opacity="0.25"/>
  <rect x="95" y="8" width="2" height="2" fill="#fff" opacity="0.2"/>
  <rect x="108" y="18" width="2" height="2" fill="#fff" opacity="0.15"/>
  <rect x="55" y="5" width="2" height="2" fill="#fff" opacity="0.2"/>
  <rect x="80" y="22" width="3" height="3" fill="#fff" opacity="0.18"/>

  <!-- Ground -->
  <line x1="0" y1="65" x2="120" y2="65" stroke="#3a4270" stroke-width="1.5"/>
  <rect x="0" y="65" width="120" height="1" fill="rgba(34,228,255,0.22)"/>
  <rect x="5" y="69" width="9" height="1.5" fill="#3a4270" opacity="0.5"/>
  <rect x="23" y="69" width="9" height="1.5" fill="#3a4270" opacity="0.5"/>
  <rect x="41" y="69" width="9" height="1.5" fill="#3a4270" opacity="0.5"/>
  <rect x="59" y="69" width="9" height="1.5" fill="#3a4270" opacity="0.5"/>
  <rect x="77" y="69" width="9" height="1.5" fill="#3a4270" opacity="0.5"/>
  <rect x="95" y="69" width="9" height="1.5" fill="#3a4270" opacity="0.5"/>

  <!-- Floor crystal -->
  <polygon points="82,65 88,48 94,65" fill="#3d1f6e"/>
  <polygon points="88,48 94,65 91,65" fill="#7c5cff"/>
  <rect x="86.5" y="43" width="3" height="5" fill="#ff2fd6"/>

  <!-- Ceiling crystal -->
  <polygon points="55,0 59,16 63,0" fill="#3d1f6e"/>
  <polygon points="59,16 63,0 61,0" fill="#7c5cff"/>
  <rect x="58" y="16" width="3" height="4" fill="#ff2fd6"/>

  <!-- Comet trail -->
  <rect x="18" y="34" width="2" height="2" fill="#22e4ff" opacity="0.08"/>
  <rect x="22" y="33.5" width="2" height="2" fill="#22e4ff" opacity="0.12"/>
  <rect x="26" y="33" width="2" height="2" fill="#22e4ff" opacity="0.18"/>
  <rect x="30" y="33.5" width="3" height="3" fill="#22e4ff" opacity="0.25"/>
  <rect x="34" y="34" width="2" height="2" fill="#22e4ff" opacity="0.32"/>
  <rect x="38" y="33.5" width="3" height="3" fill="#22e4ff" opacity="0.42"/>
  <rect x="42" y="33" width="2" height="2" fill="#22e4ff" opacity="0.55"/>
  <rect x="46" y="33.5" width="3" height="3" fill="#22e4ff" opacity="0.7"/>
  <rect x="50" y="34" width="2" height="2" fill="#22e4ff" opacity="0.85"/>

  <!-- Driftlet character (from PARTS in Player.js) -->
  <g filter="url(#glow)" transform="translate(62, 32)">
    <!-- body: x=-6,y=6,w=12,h=10 -->
    <rect x="-6" y="6" width="12" height="10" fill="#e9f6ff"/>
    <!-- core: x=-3,y=11,w=3,h=4 -->
    <rect x="-3" y="11" width="3" height="4" fill="#22e4ff"/>
    <!-- eye: x=-2,y=10,w=4,h=3 -->
    <rect x="-2" y="10" width="4" height="3" fill="#22e4ff"/>
    <!-- pupil: x=1,y=10,w=1,h=3 -->
    <rect x="1" y="10" width="1" height="3" fill="#0b0d18"/>
    <!-- lower body: x=-3,y=13,w=5,h=1 -->
    <rect x="-3" y="13" width="5" height="1" fill="#e9f6ff"/>
    <!-- left fin: x=-5,y=16,w=2,h=2 -->
    <rect x="-5" y="16" width="2" height="2" fill="#22e4ff"/>
    <!-- right fin: x=2,y=16,w=2,h=3 -->
    <rect x="2" y="16" width="2" height="3" fill="#22e4ff"/>
  </g>

  <!-- Score orb -->
  <circle cx="100" cy="42" r="3" fill="#22e4ff" opacity="0.8"/>
  <circle cx="100" cy="42" r="1.5" fill="#e9f6ff"/>
</svg>
